<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sterling Sportsmen - Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f4f4; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #2c5e3b; color: white; padding: 10px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1e4028; }
    .btn-delete { background: #c0392b; margin-left: 5px; }
    .btn-delete:hover { background: #962d22; }
    .btn-pin { background: #d35400; }
    .btn-pin:hover { background: #a04000; }
    .status { margin-top: 15px; font-weight: bold; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
    .item-row:last-child { border-bottom: none; }
    .pinned-tag { background: #f39c12; color: white; font-size: 0.75rem; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Club Admin Panel</h1>

  <div class="card">
    <h2>Post New Announcement</h2>
    <form id="announcement-form">
      <label>Title</label>
      <input type="text" id="title" placeholder="e.g. ⚠️ UPCOMING WORK DAY" required>

      <label>Date / Frequency</label>
      <input type="text" id="date" placeholder="e.g. September 15, 2026" required>

      <label>Short Summary (Displays in homepage scrollbox)</label>
      <textarea id="summary" rows="2" required></textarea>

      <label>Full Content (Displays in popup modal)</label>
      <textarea id="fullContent" rows="4" required></textarea>

      <label style="margin-top:15px; font-weight:normal;">
        <input type="checkbox" id="pinned"> Pin to top of homepage?
      </label>

      <button type="submit" style="margin-top:20px;">Publish Announcement</button>
      <div id="status" class="status"></div>
    </form>
  </div>

  <div class="card">
    <h2>Manage Existing Announcements</h2>
    <div id="announcements-list">Loading live announcements...</div>
  </div>

  <script>
    // UPDATE THIS URL TO YOUR WORKER URL
    const WORKER_URL = "https://sterling-admin-api.andrew-thorner.workers.dev";
    const RAW_JSON_URL = "../resources/announcements.json";

    // 1. Fetch and Display Active Announcements
    async function loadAnnouncements() {
      const listContainer = document.getElementById("announcements-list");
      try {
        const res = await fetch(RAW_JSON_URL + "?cache=" + Date.now());
        const data = await res.json();
        
        listContainer.innerHTML = "";
        data.forEach(item => {
          const row = document.createElement("div");
          row.className = "item-row";
          row.innerHTML = `
            <div>
              <strong>${item.title}</strong> ${item.pinned ? '<span class="pinned-tag">📌 PINNED</span>' : ''}<br>
              <small style="color:#666;">${item.date}</small>
            </div>
            <div>
              <button class="btn-pin" onclick="togglePin('${item.id}')">${item.pinned ? 'Unpin' : 'Pin'}</button>
              <button class="btn-delete" onclick="deleteItem('${item.id}')">Delete</button>
            </div>
          `;
          listContainer.appendChild(row);
        });
      } catch (err) {
        listContainer.innerText = "Error loading list.";
      }
    }

    // 2. Add New Announcement
    document.getElementById("announcement-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "Publishing to site...";

      const newEntry = {
        id: "announcement-" + Date.now(),
        title: document.getElementById("title").value,
        date: document.getElementById("date").value,
        summary: document.getElementById("summary").value,
        fullContent: document.getElementById("fullContent").value,
        pinned: document.getElementById("pinned").checked,
        hasPopup: true
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "add", newEntry })
        });

        if (res.ok) {
          statusDiv.style.color = "green";
          statusDiv.innerText = "✅ Published successfully!";
          document.getElementById("announcement-form").reset();
          setTimeout(loadAnnouncements, 2000);
        }
      } catch (err) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "❌ Error: " + err.message;
      }
    });

    // 3. Toggle Pin Status
    async function togglePin(id) {
      if (!confirm("Toggle pin status for this announcement?")) return;
      await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "togglePin", id })
      });
      setTimeout(loadAnnouncements, 2000);
    }

    // 4. Delete Announcement
    async function deleteItem(id) {
      if (!confirm("Are you sure you want to delete this announcement permanently?")) return;
      await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete", id })
      });
      setTimeout(loadAnnouncements, 2000);
    }

    // Initial load
    loadAnnouncements();
  </script>
</body>
</html>
