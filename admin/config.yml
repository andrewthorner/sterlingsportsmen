backend:
  name: git-gateway
  branch: main # or master, depending on your default branch name

# Directory where uploaded images will be stored
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. NEWS & ANNOUNCEMENTS COLLECTION
  - name: "announcements"
    label: "News & Announcements"
    file: "resources/announcements.json"
    description: "Manage news posts on the homepage scrollbox and modal popup"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Pinned Story?", name: "pinned", widget: "boolean", default: false }
      - { label: "Full Announcement Body", name: "body", widget: "markdown" }

  # 2. CALENDAR EVENTS COLLECTION
  - name: "calendar"
    label: "Calendar Dates"
    file: "resources/calendar-data.json"
    description: "Manage highlighted days on the monthly homepage calendar"
    fields:
      - { label: "Event Name", name: "title", widget: "string" }
      - { label: "Date (YYYY-MM-DD)", name: "date", widget: "string" }
      - { label: "Details", name: "description", widget: "text" }

  # 3. UPCOMING CLUB EVENTS COLLECTION
  - name: "events"
    label: "Upcoming Club Events"
    file: "resources/events-data.json"
    description: "Manage featured and upcoming events on the Events page"
    fields:
      - { label: "Event Title", name: "title", widget: "string" }
      - { label: "Event Date", name: "date", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Featured Event?", name: "featured", widget: "boolean", default: false }
      - { label: "Event Photo", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "markdown" }
