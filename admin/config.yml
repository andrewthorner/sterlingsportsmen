backend:
  name: git-gateway
  branch: main # Change to 'master' if your default branch on GitHub is master

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. NEWS & ANNOUNCEMENTS COLLECTION
  - name: "announcements_collection"
    label: "News & Announcements"
    description: "Manage news posts on the homepage scrollbox and modal popup"
    files:
      - name: "announcements_file"
        label: "Announcements List"
        file: "resources/announcements.json"
        format: "json"
        structure: "single_file"
        fields:
          - label: "Announcements"
            name: "announcements"
            widget: "list"
            root: true
            summary: "{{fields.title}}"
            fields:
              - { label: "ID / Slug", name: "id", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date / Frequency", name: "date", widget: "string" }
              - { label: "Short Summary (Scrollbox)", name: "summary", widget: "string" }
              - { label: "Full Content (Modal Popup)", name: "fullContent", widget: "text" }
              - { label: "Pinned Story?", name: "pinned", widget: "boolean", default: false }
              - { label: "Opens Modal Popup?", name: "hasPopup", widget: "boolean", default: true }

  # 2. CALENDAR EVENTS COLLECTION
  - name: "calendar_collection"
    label: "Calendar Dates"
    description: "Manage highlighted days on the monthly homepage calendar"
    files:
      - name: "calendar_file"
        label: "Monthly Calendar Data"
        file: "resources/calendar-data.json"
        format: "json"
        fields:
          - label: "Months"
            name: "months"
            widget: "list"
            root: true
            summary: "{{fields.label}}"
            fields:
              - { label: "Month Label (e.g. August 2026)", name: "label", widget: "string" }
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Month Index (0=Jan, 1=Feb, ... 7=Aug)", name: "monthIndex", widget: "number", value_type: "int" }
              - label: "Events List"
                name: "events"
                widget: "list"
                summary: "Day {{fields.day}}: {{fields.title}}"
                fields:
                  - { label: "Day of Month (1-31)", name: "day", widget: "string" }
                  - { label: "Event Name / Description", name: "title", widget: "string" }

  # 3. UPCOMING CLUB EVENTS COLLECTION
  - name: "events_collection"
    label: "Upcoming Club Events"
    description: "Manage featured and upcoming events on the Events page"
    files:
      - name: "events_file"
        label: "Events Page Data"
        file: "resources/events-data.json"
        format: "json"
        fields:
          - label: "Upcoming Events"
            name: "upcoming_events"
            widget: "list"
            fields:
              - { label: "Event Title", name: "title", widget: "string" }
              - { label: "Event Date", name: "date", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Featured Event?", name: "featured", widget: "boolean", default: false }
              - { label: "Event Photo", name: "image", widget: "image", required: false }
              - { label: "Description", name: "description", widget: "text" }
