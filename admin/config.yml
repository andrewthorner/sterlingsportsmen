backend:
  name: git-gateway
  branch: main # Change to 'master' if your default branch name is master

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. NEWS & ANNOUNCEMENTS COLLECTION
- name: "announcements_collection"
    label: "News & Announcements"
    files:
      - name: "announcements_file"
        label: "Announcements List"
        file: "resources/announcements.json"
        format: "json"
        structure: "single_file"
        fields:
          - label: "Announcements"
            name: "announcements"
            widget: "list"
            root: true
            fields:
              - { label: "ID / Slug", name: "id", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Summary", name: "summary", widget: "string" }
              - { label: "Full Content", name: "fullContent", widget: "text" }
              - { label: "Pinned?", name: "pinned", widget: "boolean", default: false }
              - { label: "Popup?", name: "hasPopup", widget: "boolean", default: true }

  # 2. CALENDAR EVENTS COLLECTION
  - name: "calendar_collection"
    label: "Calendar Dates"
    description: "Manage highlighted days on the monthly homepage calendar"
    files:
      - name: "calendar_file"
        label: "Monthly Calendar Data"
        file: "resources/calendar-data.json"
        format: "json"
        fields:
          - label: "August 2026"
            name: "August 2026"
            widget: "object"
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int", default: 2026 }
              - { label: "Month Index (0=Jan, 7=Aug)", name: "monthIndex", widget: "number", value_type: "int", default: 7 }
              - label: "Events (Day Number : Event Name)"
                name: "events"
                widget: "object"
                fields:
                  - { label: "Day 4", name: "4", widget: "string", required: false }
                  - { label: "Day 18", name: "18", widget: "string", required: false }
                  - { label: "Day 22", name: "22", widget: "string", required: false }
                  - { label: "Day 23", name: "23", widget: "string", required: false }

  # 3. UPCOMING CLUB EVENTS COLLECTION
  - name: "events_collection"
    label: "Upcoming Club Events"
    description: "Manage featured and upcoming events on the Events page"
    files:
      - name: "events_file"
        label: "Events Page Data"
        file: "resources/events-data.json"
        format: "json"
        fields:
          - label: "Upcoming Events"
            name: "upcoming_events"
            widget: "list"
            fields:
              - { label: "Event Title", name: "title", widget: "string" }
              - { label: "Event Date", name: "date", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Featured Event?", name: "featured", widget: "boolean", default: false }
              - { label: "Event Photo", name: "image", widget: "image", required: false }
              - { label: "Description", name: "text" }
